name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_ref:
        description: Git ref of the API repository (calculator_api_ts)
        default: main
        type: string

permissions:
  contents: read

env:
  API_BASE_URL: http://localhost:3000

jobs:
  api-tests:
    name: Playwright API tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Checkout API repository
        uses: actions/checkout@v6
        with:
          repository: Sascha-Pommernell/calculator_api_ts
          ref: ${{ inputs.api_ref || 'main' }}
          path: api

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Build API
        working-directory: api
        run: |
          npm ci
          npm run build

      - name: Start API and wait for /health
        working-directory: api
        run: |
          PORT=3000 nohup npm start > ../api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$API_BASE_URL/health" > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"
          cat ../api.log
          exit 1

      - run: npm ci

      - run: npm run typecheck

      - name: Run Playwright API tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: api-log
          path: api.log
